<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="/images/favicon-32x32.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="script.js"></script>
    <title>SPLITTER - Tip Calculator</title>
  </head>
  <body>
    <div class="container">
      <header>
        <img src="/images/logo.svg" alt="splitter logo" />
      </header>
      <main>
        <div class="calculator-grid">
          <!-- bill subtotal label & input -->
          <section class="form-group">
            <label for="subtotal">Bill </label>
            <div class="input-group">
              <img src="/images/icon-dollar.svg" />
              <input type="text" id="subtotal" placeholder="0" />
            </div>
          </section>
          <!-- label for tip buttons & custom input -->
          <section>
            <fieldset class="form-group-tips">
              <legend>Select Tip %</legend>

              <div class="tip-input-group">
                <input type="radio" name="tip" value=".05" id="tip-5" />
                <label for="tip-5">5%</label>
              </div>

              <div class="tip-input-group">
                <input type="radio" name="tip" value=".10" id="tip-10" /><label
                  for="tip-10"
                  >10%</label
                >
              </div>

              <div class="tip-input-group">
                <input type="radio" name="tip" value=".15" id="tip-15" /><label
                  for="tip-15"
                  >15%</label
                >
              </div>

              <div class="tip-input-group">
                <input type="radio" name="tip" value=".25" id="tip-25" /><label
                  for="tip-25"
                  >25%</label
                >
              </div>

              <div class="tip-input-group">
                <input type="radio" name="tip" value=".55" id="tip-50" /><label
                  for="tip-50"
                  >50%</label
                >
              </div>

              <div class="tip-input-group">
                <label for="tip-custom" class="sr-only">Custom Tip Amount</label
                ><input type="text" id="tip-custom" />
              </div>
            </fieldset>
          </section>
          <!-- number of people label & input -->
          <section class="form-group">
            <label for="num-people">Number of People</label>
            <div class="input-group">
              <img src="/images/icon-person.svg" />
              <input type="text" id="num-people" placeholder="0" />
            </div>
          </section>
          <!-- display -->
          <section class="form-group"></section>
        </div>
      </main>
    </div>
  </body>
</html>
